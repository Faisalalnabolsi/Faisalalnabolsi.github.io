<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <!-- Stops search engines from listing the site. Delete this line if you want Google to find it. -->
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Name, tagline, email, about text and the YouTube link are edited in Pages CMS ("Site info"). -->
  <header class="top">
    <div class="intro">
      <h1 id="name">Your Name</h1>
      <p><span id="tagline">Graphic designer</span> &middot; <a id="email" href="mailto:you@example.com">you@example.com</a></p>
      <p id="about" class="about" hidden></p>
    </div>
    <a id="yt" class="yt">
      <svg viewBox="0 0 64 45" aria-hidden="true"><rect width="64" height="45" rx="12" fill="#ff0033"/><path d="M26 13l17 9.5L26 32z" fill="#fff"/></svg>
      <span id="ytlabel">Motion &amp; Animation Samples</span>
    </a>
  </header>

  <nav id="filters" class="filters" hidden></nav>
  <main class="grid" id="grid"></main>

  <dialog id="viewer">
    <div class="vbox">
      <button class="vbtn vclose" id="vclose" aria-label="Close">&times;</button>
      <button class="vbtn vprev" id="vprev" aria-label="Previous">&#8249;</button>
      <img id="vimg" alt="">
      <iframe id="vvid" class="vvid" hidden allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="Video"></iframe>
      <button class="vbtn vnext" id="vnext" aria-label="Next">&#8250;</button>
      <p class="vcap" id="vcap"></p>
    </div>
  </dialog>

  <script>
    const $ = id => document.getElementById(id);
    const load = f => fetch(f, { cache: 'no-cache' }).then(r => { if (!r.ok) throw 0; return r.json(); });
    const SIZES = ['wide', 'tall', 'big', 'banner'];

    // Tags: a work can have many. The old single "category" is treated as one more tag.
    const norm = t => String(t).trim().toLowerCase();
    const tagText = t => {
      const s = String(t).trim();
      const m = s.match(/([^\/]+)\.(json|ya?ml|md)$/i); // a file path such as tags/branding.json
      return m ? m[1].replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : s;
    };
    const tagsOf = w => [].concat(w.tags || [], w.category || []).map(tagText).filter(Boolean);

    // Grid frames use the small copy in /thumbs (made automatically); the full-size view uses the original.
    const thumbOf = src => String(src).replace(/^(\/?)images\//, '$1thumbs/');

    // ----- Site info -----
    const sitePromise = load('site.json').catch(() => ({}));
    sitePromise.then(s => {
      if (s.name) { $('name').textContent = s.name; document.title = s.name + ' – Portfolio'; }
      if (s.tagline) $('tagline').textContent = s.tagline;
      if (s.email) { $('email').textContent = s.email; $('email').href = 'mailto:' + s.email; }
      if (s.about) { $('about').textContent = s.about; $('about').hidden = false; }
      if (s.youtube_label) $('ytlabel').textContent = s.youtube_label;
      if (s.youtube_url) { $('yt').href = s.youtube_url; $('yt').target = '_blank'; $('yt').rel = 'noopener'; }
    });

    // ----- Turn a YouTube / Vimeo link into an embeddable player -----
    function parseVideo(link) {
      try {
        const clean = String(link).trim();
        const u = new URL(/^https?:\/\//i.test(clean) ? clean : 'https://' + clean), h = u.hostname.replace(/^www\./, '');
        const parts = u.pathname.split('/').filter(Boolean);
        if (h === 'youtu.be' || h.endsWith('youtube.com')) {
          let id = h === 'youtu.be' ? parts[0] : u.searchParams.get('v');
          if (!id && ['shorts', 'embed', 'live'].includes(parts[0])) id = parts[1];
          if (!id) return null;
          return { embed: 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0&autoplay=1',
                   thumb: 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg' };
        }
        if (h === 'vimeo.com' || h === 'player.vimeo.com') {
          const id = parts.find(p => /^\d+$/.test(p));
          if (!id) return null;
          const hash = parts[parts.indexOf(id) + 1];
          return { embed: 'https://player.vimeo.com/video/' + id + (hash && /^[0-9a-f]+$/i.test(hash) ? '?h=' + hash + '&autoplay=1' : '?autoplay=1'),
                   thumb: '' };
        }
      } catch (e) {}
      return null;
    }

    // ----- Full-size viewer (images and videos) -----
    const viewer = $('viewer'), vimg = $('vimg'), vvid = $('vvid');
    let cur = [], idx = 0;
    function showImage(s) {
      const pre = new Image();
      pre.src = s.i;
      // Already downloaded (background loading done)? Show the full image straight away.
      if (pre.complete && pre.naturalWidth) { vimg.src = s.i; return; }
      // Otherwise show the small copy instantly, then swap to the full image when it has loaded.
      vimg.src = thumbOf(s.i);
      pre.onload = () => { if (cur[idx] === s) vimg.src = s.i; };
    }
    // If a thumbnail is missing, use the original instead
    vimg.onerror = () => {
      const s = cur[idx];
      if (s && s.i && vimg.getAttribute('src') !== s.i) vimg.src = s.i;
    };
    function show(i) {
      idx = (i + cur.length) % cur.length;
      const s = cur[idx];
      vvid.hidden = !s.v;
      vimg.hidden = !!s.v;
      vvid.src = s.v || 'about:blank';
      if (!s.v) showImage(s);
      const n = cur[(idx + 1) % cur.length];            // get the next image ready
      if (n && n.i) new Image().src = n.i;
    }
    function openViewer(w, slides) {
      cur = slides;
      vimg.alt = w.alt || '';
      $('vcap').textContent = [w.title, w.alt, ...tagsOf(w), w.year].filter(Boolean).join(' · ');
      $('vprev').hidden = $('vnext').hidden = slides.length < 2;
      show(0);
      viewer.showModal();
    }
    vimg.onclick = () => cur.length > 1 ? show(idx + 1) : viewer.close();
    $('vprev').onclick = () => show(idx - 1);
    $('vnext').onclick = () => show(idx + 1);
    $('vclose').onclick = () => viewer.close();
    viewer.addEventListener('close', () => { vvid.src = 'about:blank'; }); // stops the video
    viewer.addEventListener('click', e => { if (e.target === viewer) viewer.close(); });
    document.addEventListener('keydown', e => {
      if (!viewer.open || cur.length < 2) return;
      if (e.key === 'ArrowRight') show(idx + 1);
      if (e.key === 'ArrowLeft') show(idx - 1);
    });

    // ----- Grid -----
    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function preloadFull(list) {
      const c = navigator.connection;
      if (c && (c.saveData || /2g|3g/.test(c.effectiveType || ''))) return; // respect slow connections / data saver
      const queue = list.map(it => it.slides[0]).filter(s => s && s.i).map(s => s.i);
      const next = () => {
        const src = queue.shift();
        if (!src) return;
        const im = new Image();
        im.fetchPriority = 'low';
        im.onload = im.onerror = next;
        im.src = src;
      };
      next(); next(); // two at a time
    }

    const grid = $('grid');
    Promise.all([load('works.json'), sitePromise]).then(([works, site]) => {
      // Build every frame once, in the order of works.json
      const items = works.map(w => {
        const vid = w.video_url ? parseVideo(w.video_url) : null;
        const cover = w.image || (vid && vid.thumb) || '';
        // Slides: the video first (if any), otherwise the main image, then any extra images
        const slides = (vid ? [{ v: vid.embed }] : (w.image ? [{ i: w.image }] : []))
          .concat([].concat(w.more_images || []).filter(Boolean).map(i => ({ i })));

        const frame = document.createElement('button');
        frame.className = 'frame' + (SIZES.includes(w.size) ? ' ' + w.size : '') + (vid ? ' hasvideo' : '');
        const img = document.createElement('img');
        img.alt = w.alt || '';
        img.loading = 'lazy';
        img.onerror = () => {
          // thumbnail not made yet? fall back to the original once
          if (!img.dataset.fallback && cover && thumbOf(cover) !== cover) { img.dataset.fallback = '1'; img.src = cover; }
          else frame.classList.add('empty');
        };
        if (cover) img.src = thumbOf(cover); else frame.classList.add('empty');
        frame.appendChild(img);
        frame.onclick = () => { if (slides.length && !frame.classList.contains('empty')) openViewer(w, slides); };
        return { w, frame, slides, keys: new Set(tagsOf(w).map(norm)) };
      });

      // The main ("All") view is shuffled on every page load; tag views keep works.json order.
      const shuffled = shuffle([...items]);
      // Tags chosen under "Site info" in Pages CMS are shuffled too (once per page load); the rest stay in order.
      const shuffleKeys = new Set([].concat(site.shuffle_tags || []).map(t => norm(tagText(t))));
      const tagOrder = new Map();
      const place = list => list.forEach(it => grid.appendChild(it.frame)); // appendChild also re-orders
      place(shuffled);

      // After the page and its thumbnails have loaded, quietly download the full-size images
      // in the background (two at a time, low priority) so they open instantly.
      const go = () => setTimeout(() => preloadFull(shuffled), 800);
      if (document.readyState === 'complete') go(); else addEventListener('load', go);

      // Tag buttons: every different tag used by any work (capitals and spaces are ignored when matching)
      const labels = new Map();
      works.forEach(w => tagsOf(w).forEach(t => { if (!labels.has(norm(t))) labels.set(norm(t), t); }));
      if (labels.size > 1) {
        const nav = $('filters');
        [[null, 'All'], ...labels].forEach(([key, label], i) => {
          const b = document.createElement('button');
          b.textContent = label;
          if (i === 0) b.className = 'on';
          b.onclick = () => {
            nav.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
            let order = items;
            if (key === null) order = shuffled;
            else if (shuffleKeys.has(key)) {
              if (!tagOrder.has(key)) tagOrder.set(key, shuffle([...items]));
              order = tagOrder.get(key);
            }
            place(order);
            items.forEach(it => { it.frame.hidden = key !== null && !it.keys.has(key); });
          };
          nav.appendChild(b);
        });
        nav.hidden = false;
      }
    }).catch(() => {
      grid.innerHTML = '<p style="color:#a99fc0;grid-column:1/-1">Could not load the portfolio. If you opened this file from your computer, view it through your GitHub link instead.</p>';
    });
  </script>
</body>
</html>
