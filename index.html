<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name – Graphic Design Portfolio</title>
  <!-- Stops search engines from listing the site. Delete this line if you want Google to find it. -->
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Faisal AlNabolsi</h1>
    <p>Motion & Graphic Designer &middot; <a href="mailto:you@example.com">Faisalalnabolsi@Gmail.com</a></p>
  </header>

  <!-- The frames are created automatically from works.json (edited through Pages CMS). -->
  <main class="grid" id="grid"></main>

  <dialog id="viewer"><img alt=""></dialog>

  <script>
    const grid = document.getElementById('grid');
    const viewer = document.getElementById('viewer');
    const viewerImg = viewer.querySelector('img');
    const SIZES = ['wide', 'tall', 'big', 'banner']; // "square" needs no extra class

    fetch('works.json', { cache: 'no-cache' })
      .then(res => {
        if (!res.ok) throw new Error('works.json not found');
        return res.json();
      })
      .then(works => {
        works.forEach(work => {
          const frame = document.createElement('button');
          frame.className = 'frame' + (SIZES.includes(work.size) ? ' ' + work.size : '');

          const img = document.createElement('img');
          img.alt = work.alt || '';
          img.onerror = () => frame.classList.add('empty');
          if (work.image) img.src = work.image;
          else frame.classList.add('empty');
          frame.appendChild(img);

          // Click a work to see it full size.
          frame.addEventListener('click', () => {
            if (frame.classList.contains('empty')) return;
            viewerImg.src = img.src;
            viewerImg.alt = img.alt;
            viewer.showModal();
          });

          grid.appendChild(frame);
        });
      })
      .catch(() => {
        grid.innerHTML = '<p style="color:#a99fc0;grid-column:1/-1">Could not load the portfolio. If you opened this file directly from your computer, view it through your GitHub link instead.</p>';
      });

    viewer.addEventListener('click', () => viewer.close());
  </script>
</body>
</html>
