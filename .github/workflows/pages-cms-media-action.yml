name: Optimize images
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jpegoptim optipng gifsicle
      - name: Optimize images
        run: |
          find images -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -exec jpegoptim --max=90 --strip-all {} +
          find images -type f -iname '*.png' -exec optipng -o2 {} +
          find images -type f -iname '*.gif' -exec gifsicle -O3 -b {} +
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet || git commit -m "Optimize images"
          git push
