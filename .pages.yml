media:
  input: images
  output: /images
  rename: safe
  extensions: [jpg, jpeg, png, gif, webp]
content:
  - name: taglist
    label: Tags
    type: collection
    path: tags
    format: json
    fields:
      - name: title
        label: Tag name
        type: string
  - name: works
    label: Portfolio works
    type: file
    path: works.json
    format: json
    list: true
    fields:
      - name: image
        label: Main image
        type: image
      - name: more_images
        label: Extra images (shown in the full-size view)
        type: image
        options:
          multiple:
            max: 8
      - name: alt
        label: Description
        type: string
      - name: video_url
        label: Video link (YouTube or Vimeo)
        type: string
        description: Optional. Paste the link from the video's page.
      - name: tags
        label: Tags
        type: reference
        description: Pick one or more tags. To make a new tag, add it first in the Tags section.
        options:
          collection: taglist
          multiple: true
          search: title
          value: "{primary}"
          label: "{primary}"
      - name: year
        label: Year
        type: number
      - name: size
        label: Frame size
        type: select
        default: square
        options:
          values:
            - { name: square, label: "Standard (1 frame)" }
            - { name: wide, label: "Wide (2 columns)" }
            - { name: tall, label: "Tall (2 rows)" }
            - { name: big, label: "Big (2 columns, 2 rows)" }
            - { name: banner, label: "Banner (full row)" }
  - name: site
    label: Site info
    type: file
    path: site.json
    format: json
    fields:
      - { name: name, label: Your name, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: email, label: Email, type: string }
      - { name: about, label: About text, type: text }
      - { name: youtube_url, label: YouTube link, type: string }
      - { name: youtube_label, label: Text under the YouTube icon, type: string }
